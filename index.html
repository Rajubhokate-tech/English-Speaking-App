<title>इंग्रजी बोलण्याचा सराव</title>
<style>
:root{--bg:#f7f8fb;--card:#fff;--text:#1d2433;--muted:#6b7280;--accent:#2563eb;--ok:#16a34a;--bad:#dc2626;--line:#e5e7eb}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#1a2130;--text:#e6e9f2;--muted:#9aa3b5;--accent:#60a5fa;--ok:#4ade80;--bad:#f87171;--line:#2a3345}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#1a2130;--text:#e6e9f2;--muted:#9aa3b5;--accent:#60a5fa;--ok:#4ade80;--bad:#f87171;--line:#2a3345}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"Noto Sans Devanagari","Noto Sans",sans-serif}
body{padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:16px 0}
h1{font-size:1.3rem;margin:8px 0 14px;text-align:center}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;font-size:.95rem;cursor:pointer}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab:disabled{opacity:.4;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px}
.progress{font-size:.85rem;color:var(--muted);margin-bottom:8px}
.en{font-size:1.3rem;font-weight:600;line-height:1.5;margin:6px 0 10px}
.mr{color:var(--muted);font-size:1rem;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}
button.action{flex:1;min-width:130px;padding:13px;border:0;border-radius:10px;font-size:1rem;cursor:pointer;background:var(--accent);color:#fff}
button.action.secondary{background:var(--card);color:var(--text);border:1px solid var(--line)}
button.action:disabled{opacity:.5}
.result{margin-top:14px;padding:14px;border-radius:10px;border:1px solid var(--line)}
.good{color:var(--ok);font-weight:600}
.bad{color:var(--bad);font-weight:600}
.heard{color:var(--muted);font-size:.95rem;margin-top:6px}
.missing{margin-top:6px}
.miss-word{display:inline-block;background:rgba(220,38,38,.12);color:var(--bad);border-radius:6px;padding:2px 6px;margin:2px;font-size:.9rem}
.note{font-size:.85rem;color:var(--muted);margin-top:14px;line-height:1.5}
.stats{display:flex;justify-content:space-between;font-size:.9rem;color:var(--muted);margin-bottom:10px}
</style>
</head>
<body>
<div class="wrap">

  <div class="tabs" id="tabs"></div>

  <div class="card" id="app">
    <div class="progress" id="progress"></div>
    <div class="en" id="en"></div>
    <div class="mr" id="mr"></div>

    </div>

  <p class="note" id="support"></p>
</div>

    ["Why should we hire you over other candidates?", "इतर उमेदवारांपेक्षा आम्ही तुम्हाला का निवडावे?"],
    ["What is your biggest weakness?", "तुमची सर्वात मोठी कमकुवत बाजू कोणती आहे?"],
    ["How do you handle conflict within a team?", "टीममधील मतभेद तुम्ही कसे हाताळता?"],
    ["Describe a situation where you had to make a difficult decision.", "तुम्हाला कठीण निर्णय घ्यावा लागला अशी परिस्थिती सांगा."],
    ["Why are you leaving your current job?", "तुम्ही सध्याची नोकरी का सोडत आहात?"],
    ["What motivates you to do your best work?", "तुमचे सर्वोत्तम काम करण्यासाठी तुम्हाला कशामुळे प्रेरणा मिळते?"],
    ["How would your colleagues describe you?", "तुमचे सहकारी तुमचे वर्णन कसे करतील?"],
    ["Where do you see the industry heading in the next five years?", "पुढच्या पाच वर्षांत उद्योगक्षेत्र कुठे जाईल असे तुम्हाला वाटते?"],
    ["Do you have any questions for us?", "तुम्हाला आमच्याबद्दल काही प्रश्न आहेत का?"]
  ]},
{ title: "व्यवसाय आणि वाटाघाटी (Business and Negotiation)", items: [
    ["We are open to a compromise that works for both parties.", "दोन्ही पक्षांच्या हिताचा मध्यममार्ग काढण्यास आम्ही तयार आहोत."],
    ["Our proposal offers better value for a comparable price.", "आमचा प्रस्ताव तुलनेने समान किमतीत अधिक मूल्य देतो."],
    ["Could we revisit the terms of the contract?", "आपण कराराच्या अटींवर पुन्हा चर्चा करू शकतो का?"],
    ["That price is beyond our current budget.", "ती किंमत आमच्या सध्याच्या बजेटच्या बाहेर आहे."],
    ["We would need a stronger guarantee before proceeding.", "पुढे जाण्यापूर्वी आम्हाला अधिक भक्कम हमी हवी आहे."],
    ["The market conditions have changed significantly since last year.", "गेल्या वर्षापासून बाजारपेठेची परिस्थिती लक्षणीयरीत्या बदलली आहे."],
    ["We aim to build a long-term partnership rather than a one-time deal.", "एकदाच्या व्यवहारापेक्षा दीर्घकालीन भागीदारी उभारणे हे आमचे उद्दिष्ट आहे."],
    ["Let us agree on the deliverables and the timeline.", "आपण कामाचे टप्पे आणि वेळापत्रक निश्चित करूया."],
    ["Profit margins are thin, so we must control costs carefully.", "नफ्याचे प्रमाण कमी आहे, म्हणून खर्चावर काळजीपूर्वक नियंत्रण ठेवायला हवे."],
    ["I believe we can reach a win-win agreement by Friday.", "मला विश्वास आहे की शुक्रवारपर्यंत आपण दोघांनाही फायदा होईल असा करार करू शकतो."]
  ]},
  { title: "नेतृत्व (Leadership)", items: [
    ["A good leader listens before making a decision.", "चांगला नेता निर्णय घेण्यापूर्वी ऐकून घेतो."],
    ["I believe in leading by example rather than by instruction.", "केवळ आदेश देण्यापेक्षा उदाहरण घालून देऊन नेतृत्व करण्यावर माझा विश्वास आहे."],
    ["Our team needs clear goals and regular feedback.", "आमच्या टीमला स्पष्ट ध्येये आणि नियमित अभिप्राय हवा आहे."],
    ["Delegation allows the team to grow and take ownership.", "कामाची विभागणी केल्याने टीम वाढते आणि जबाबदारी स्वीकारते."],
    ["I try to create an environment where people feel safe to speak up.", "लोकांना मोकळेपणाने बोलता येईल असे वातावरण मी तयार करण्याचा प्रयत्न करतो."],
    ["Difficult times reveal the true character of a leader.", "कठीण काळ नेत्याचे खरे चारित्र्य दाखवतो."],
    ["Motivation comes from purpose, not only from rewards.", "प्रेरणा केवळ बक्षिसातून नाही, तर उद्देशातून मिळते."],
    ["We must address conflicts early before they grow.", "मतभेद वाढण्यापूर्वीच त्यावर लवकर तोडगा काढायला हवा."],
    ["Accountability should be shared, not blamed on one person.", "जबाबदारी एकाच व्यक्तीवर ढकलण्याऐवजी सर्वांनी मिळून स्वीकारायला हवी."],
    ["Good leadership is about empowering others to succeed.", "चांगले नेतृत्व म्हणजे इतरांना यशस्वी होण्यासाठी सक्षम करणे."]
  ]},
  { title: "संशोधन आणि आकडेवारी (Research and Data)", items: [
    ["The sample size was too small to draw firm conclusions.", "ठाम निष्कर्ष काढण्यासाठी नमुना आकार खूप लहान होता."],
    ["Correlation does not necessarily imply causation.", "सहसंबंध म्हणजे नेहमीच कार्यकारणभाव असतो असे नाही."],
    ["The results were statistically significant at the five percent level.", "पाच टक्के पातळीवर निकाल सांख्यिकीदृष्ट्या महत्त्वाचे होते."],
    ["We need to control for other variables in this analysis.", "या विश्लेषणात इतर घटकांचे नियंत्रण करणे आवश्यक आहे."],
    ["The findings are preliminary and require further verification.", "हे निष्कर्ष प्राथमिक असून त्यांची पुढील पडताळणी गरजेची आहे."],
    ["Peer review helps ensure the credibility of research.", "समवयस्क परीक्षणामुळे संशोधनाची विश्वासार्हता टिकते."],
    ["The data suggests a steady increase over the past decade.", "गेल्या दशकभरात आकडेवारी सातत्यपूर्ण वाढ दर्शवते."],
    ["We should be cautious about generalising these results.", "हे निकाल सर्वसाधारणपणे लागू करताना आपण सावध राहायला हवे."],
    ["The methodology was clearly described in the appendix.", "कार्यपद्धती परिशिष्टात स्पष्टपणे मांडली आहे."],
    ["Accurate data collection is the foundation of reliable analysis.", "अचूक माहिती संकलन हा विश्वासार्ह विश्लेषणाचा पाया आहे."]
  ]},
  { title: "समाज आणि संस्कृती (Society and Culture)", items: [
    ["Cultural traditions evolve as societies change over time.", "समाज काळानुसार बदलतो, तसे सांस्कृतिक परंपराही विकसित होतात."],
    ["Education plays a vital role in reducing social inequality.", "सामाजिक विषमता कमी करण्यात शिक्षणाची महत्त्वाची भूमिका असते."],
    ["Language is closely tied to a community's identity.", "भाषा समाजाच्या ओळखीशी घट्टपणे जोडलेली असते."],
    ["Public opinion can shape government policy in a democracy.", "लोकशाहीत जनमत सरकारच्या धोरणांना आकार देऊ शकते."],
    ["Many festivals bring people together across different communities.", "अनेक सण वेगवेगळ्या समाजांतील लोकांना एकत्र आणतात."],
    ["Urbanisation has changed the structure of traditional families.", "शहरीकरणामुळे पारंपरिक कुटुंबांची रचना बदलली आहे."],
    ["Social media has changed how people share and receive news.", "सोशल मीडियामुळे लोक बातम्या कशा शेअर करतात आणि मिळवतात, ते बदलले आहे."],
    ["Respect for diversity makes a society stronger.", "विविधतेबद्दल आदर असल्याने समाज अधिक बळकट होतो."],
    ["Historical events continue to influence present-day debates.", "ऐतिहासिक घटना आजच्या चर्चांवर सतत प्रभाव टाकतात."],
    ["Community participation is essential for sustainable development.", "शाश्वत विकासासाठी सामुदायिक सहभाग आवश्यक आहे."]
  ]},
  { title: "तंत्रज्ञान (Technology)", items: [
    ["Artificial intelligence is transforming many industries rapidly.", "कृत्रिम बुद्धिमत्ता अनेक उद्योगांमध्ये वेगाने बदल घडवत आहे."],
    ["Data privacy has become a serious concern for users.", "डेटा गोपनीयता ही वापरकर्त्यांसाठी गंभीर चिंता बनली आहे."],
    ["The software update introduced several important security fixes.", "सॉफ्टवेअर अपडेटमध्ये अनेक महत्त्वाच्या सुरक्षा दुरुस्त्या आल्या आहेत."],
    ["Cloud computing reduces the need for expensive hardware.", "क्लाउड कॉम्प्युटिंगमुळे महागड्या हार्डवेअरची गरज कमी होते."],
    ["Automation can improve efficiency, but it also raises questions about jobs.", "ऑटोमेशनमुळे कार्यक्षमता वाढते, पण नोकऱ्यांबाबत प्रश्नही निर्माण होतात."],
    ["Digital literacy is now as important as traditional literacy.", "आता डिजिटल साक्षरता पारंपरिक साक्षरतेइतकीच महत्त्वाची आहे."],
    ["The app works offline, which is useful in areas with poor connectivity.", "हे अ‍ॅप इंटरनेटशिवाय चालते, त्यामुळे कमी नेटवर्क असलेल्या भागांत ते उपयुक्त आहे."],
    ["We need to test the system thoroughly before launching it.", "प्रणाली सुरू करण्यापूर्वी तिची काटेकोर चाचणी करायला हवी."],
    ["Open-source tools allow developers to collaborate across borders.", "ओपन-सोर्स साधनांमुळे विकासक देशांच्या सीमा ओलांडून एकत्र काम करू शकतात."],
    ["Technology should serve people, not the other way around.", "तंत्रज्ञान लोकांच्या सेवेसाठी असायला हवे, उलट नव्हे."]
  ]},
{ title: "शिक्षण धोरण (Education Policy)", items: [
    ["Education reform must address both access and quality.", "शिक्षण सुधारणेत प्रवेश आणि गुणवत्ता, दोन्ही गोष्टींकडे लक्ष देणे आवश्यक आहे."],
    ["Rote learning often fails to develop critical thinking.", "पाठांतरामुळे अनेकदा चिकित्सक विचारशक्तीचा विकास होत नाही."],
    ["Teachers need continuous training to keep pace with change.", "बदलाशी जुळवून घेण्यासाठी शिक्षकांना सतत प्रशिक्षणाची गरज असते."],
    ["Vocational education can offer a practical path to employment.", "व्यावसायिक शिक्षण रोजगाराचा व्यावहारिक मार्ग खुला करू शकते."],
    ["Multilingual education helps children learn concepts more effectively.", "बहुभाषिक शिक्षणामुळे मुलांना संकल्पना अधिक प्रभावीपणे समजतात."],
    ["The curriculum should encourage creativity alongside academic knowledge.", "अभ्यासक्रमाने शैक्षणिक ज्ञानासोबत सर्जनशीलतेलाही प्रोत्साहन द्यायला हवे."],
    ["Rural schools often face shortages of qualified teachers.", "ग्रामीण शाळांना अनेकदा पात्र शिक्षकांच्या तुटवड्याचा सामना करावा लागतो."],
    ["Assessment should measure understanding, not only memorisation.", "मूल्यमापनाने केवळ लक्षात ठेवणे नव्हे, तर समजून घेणे मोजायला हवे."],
    ["Lifelong learning is becoming necessary in a fast-changing economy.", "वेगाने बदलणाऱ्या अर्थव्यवस्थेत आयुष्यभर शिकणे आवश्यक बनत आहे."],
    ["Equal opportunity in education is a cornerstone of a fair society.", "शिक्षणातील समान संधी हा निष्पक्ष समाजाचा पाया आहे."]
  ]},
  { title: "पर्यावरण आणि शाश्वतता (Environment and Sustainability)", items: [
    ["Climate change is no longer a distant threat; it is happening now.", "हवामान बदल आता दूरचा धोका राहिलेला नाही; तो आत्ताच घडत आहे."],
    ["Renewable energy reduces our dependence on fossil fuels.", "नवीकरणीय ऊर्जेमुळे जीवाश्म इंधनावरील आपले अवलंबित्व कमी होते."],
    ["Deforestation affects rainfall patterns and biodiversity.", "वृक्षतोडीचा परिणाम पावसाच्या चक्रावर आणि जैवविविधतेवर होतो."],
    ["Sustainable farming protects soil fertility for future generations.", "शाश्वत शेती भावी पिढ्यांसाठी मातीची सुपीकता टिकवते."],
    ["Industrial waste must be treated before it is released into rivers.", "औद्योगिक कचरा नद्यांमध्ये सोडण्यापूर्वी त्यावर प्रक्रिया करायला हवी."],
    ["Individual choices, when multiplied, can make a significant difference.", "वैयक्तिक निर्णय एकत्र आल्यावर मोठा फरक घडवू शकतात."],
    ["Water conservation is critical in regions facing scarcity.", "पाणीटंचाई असलेल्या भागांत जलसंवर्धन अत्यंत महत्त्वाचे आहे."],
    ["Environmental laws are useful only when they are enforced.", "पर्यावरणविषयक कायदे तेव्हाच उपयुक्त ठरतात जेव्हा त्यांची अंमलबजावणी होते."],
    ["Cities must plan green spaces as part of urban development.", "शहरी विकासाचा भाग म्हणून शहरांनी हिरव्या जागांचे नियोजन करायला हवे."],
    ["Sustainability requires balancing economic growth with environmental care.", "शाश्वततेसाठी आर्थिक वाढ आणि पर्यावरणाची काळजी यांचा समतोल साधावा लागतो."]
  ]},
  { title: "आरोग्य आणि विज्ञान (Health and Science)", items: [
    ["Preventive healthcare reduces the burden on hospitals in the long run.", "प्रतिबंधात्मक आरोग्यसेवेमुळे दीर्घकाळात रुग्णालयांवरील ताण कमी होतो."],
    ["Vaccination has saved millions of lives around the world.", "लसीकरणामुळे जगभरात लाखो जीव वाचले आहेत."],
    ["Mental health deserves the same attention as physical health.", "मानसिक आरोग्याला शारीरिक आरोग्याइतकेच लक्ष मिळायला हवे."],
    ["The clinical trial showed promising results in the early phase.", "सुरुवातीच्या टप्प्यात क्लिनिकल चाचणीचे निकाल आशादायक दिसले."],
    ["Scientists rely on repeatable experiments to verify their theories.", "शास्त्रज्ञ आपले सिद्धांत पडताळण्यासाठी पुनरावृत्ती करता येणाऱ्या प्रयोगांवर अवलंबून असतात."],
    ["Good nutrition is the foundation of a healthy immune system.", "पौष्टिक आहार हा निरोगी रोगप्रतिकारशक्तीचा पाया आहे."],
    ["Public awareness plays a key role in controlling infectious diseases.", "संसर्गजन्य रोगांवर नियंत्रण ठेवण्यात जनजागृतीची मोठी भूमिका असते."],
    ["Advances in medicine have increased average life expectancy.", "वैद्यकशास्त्रातील प्रगतीमुळे सरासरी आयुर्मान वाढले आहे."],
    ["Ethical considerations are essential in medical research.", "वैद्यकीय संशोधनात नैतिक बाबी अत्यावश्यक असतात."],
    ["Early diagnosis often makes treatment more effective.", "लवकर निदान झाल्यास उपचार अनेकदा अधिक प्रभावी ठरतात."]
  ]},
  { title: "कायदा आणि नागरिकत्व (Law and Citizenship)", items: [
    ["Every citizen has the right to information under the law.", "कायद्यानुसार प्रत्येक नागरिकाला माहितीचा अधिकार आहे."],
    ["The judiciary must remain independent of political pressure.", "न्यायव्यवस्था राजकीय दबावापासून स्वतंत्र राहिली पाहिजे."],
    ["Ignorance of the law is not an acceptable excuse.", "कायद्याचे अज्ञान हे स्वीकारार्ह कारण नाही."],
    ["Voting is both a right and a responsibility of a citizen.", "मतदान हा नागरिकाचा हक्क आणि जबाबदारी, दोन्ही आहे."],
    ["The constitution guarantees equality before the law.", "संविधान कायद्यासमोर समानतेची हमी देते."],
    ["Legal aid is available to those who cannot afford a lawyer.", "ज्यांना वकील परवडत नाही त्यांना कायदेशीर मदत उपलब्ध आहे."],
    ["Public interest litigation allows citizens to raise common concerns in court.", "सार्वजनिक हितयाचिकेमुळे नागरिकांना सामायिक चिंता न्यायालयात मांडता येतात."],
    ["Transparency in government strengthens public trust.", "सरकारमधील पारदर्शकतेमुळे जनतेचा विश्वास वाढतो."],
    ["Consumer rights protect buyers from unfair trade practices.", "ग्राहक हक्कांमुळे अन्याय्य व्यापार पद्धतींपासून खरेदीदारांचे संरक्षण होते."],
    ["Civic participation makes democracy meaningful.", "नागरी सहभागामुळे लोकशाहीला अर्थ प्राप्त होतो."]
  ]},

const ADVANCED_ITEMS = [];
for (const l of ADVANCED_ALL) for (const it of l.items) ADVANCED_ITEMS.push([it[0], it[1], l.title]);
const LEVELS = [
  { name: "नवशिक्या", items: BEGINNER_ITEMS },
  { name: "मध्यम", items: MIDDLE_ITEMS },
  { name: "प्रगत", items: ADVANCED_ITEMS }
];

const PASS = 0.8;
const state = { level: 0, idx: 0, scores: {} };

const $ = id => document.getElementById(id);
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

function normalize(s) {
  return s.toLowerCase().replace(/[^a-z0-9\s']/g, " ").replace(/\s+/g, " ").trim();
}

function isUnlocked(i) {
  return true; // सर्व स्तर सुरुवातीपासून उघडे
  const prev = LEVELS[i - 1].items.length;
  let done = 0;
  for (let k = 0; k < prev; k++) {
    const s = state.scores[`${i - 1}-${k}`];
    if (s !== undefined && s >= PASS) done++;
  }
  return done / prev >= PASS;
}

function renderTabs() {
  $("tabs").innerHTML = "";
  LEVELS.forEach((lv, i) => {
    const b = document.createElement("button");
    b.className = "tab" + (i === state.level ? " active" : "");
    b.textContent = lv.name + (isUnlocked(i) ? "" : " 🔒");
    b.disabled = !isUnlocked(i);
    b.onclick = () => { state.level = i; state.idx = 0; render(); };
    $("tabs").appendChild(b);
  });
}

function render() {
  renderTabs();
  const items = LEVELS[state.level].items;
  if (state.idx >= items.length) {
    showSummary();
    return;
  }
  $("summary").style.display = "none";
  $("app").style.display = "block";
  const [en, mr] = items[state.idx];
  $("progress").textContent = `${LEVELS[state.level].name} • ${state.idx + 1} / ${items.length}${items[state.idx][2] ? " • " + items[state.idx][2] : ""}`;
  $("en").textContent = en;
  $("mr").textContent = mr;
  $("result").innerHTML = "";
  $("prev").disabled = state.idx === 0;
  $("support").textContent = SpeechRec
    ? ""
    : "हे ब्राउझर बोलणे ओळखत नाही. Chrome (Android) किंवा Chrome (कॉम्प्युटर) वापरा.";
  $("speak").disabled = !SpeechRec;
}

function showSummary() {
  $("app").style.display = "none";
  const items = LEVELS[state.level].items;
  let done = 0, total = 0;
  items.forEach((_, k) => {
    const s = state.scores[`${state.level}-${k}`];
    if (s !== undefined) { total++; if (s >= PASS) done++; }
  });
  const pct = Math.round((done / items.length) * 100);
  const canNext = state.level + 1 < LEVELS.length && isUnlocked(state.level + 1);
  $("summary").style.display = "block";
  $("summary").innerHTML = `
    <div class="en">${LEVELS[state.level].name} पूर्ण!</div>
    <div class="mr">${done} / ${items.length} वाक्ये ${Math.round(PASS*100)}% पेक्षा जास्त योग्य (${pct}%)</div>
    <div class="row">
      <button class="action secondary" id="retry">पुन्हा सराव</button>
      ${canNext ? '<button class="action" id="gonext">पुढची पातळी →</button>' : ""}
    </div>
    ${!canNext && state.level + 1 < LEVELS.length ? '<p class="note">पुढची पातळी उघडण्यासाठी किमान ८०% वाक्ये योग्य बोला.</p>' : ""}`;
  $("retry").onclick = () => { state.idx = 0; render(); };
  if (canNext) $("gonext").onclick = () => { state.level++; state.idx = 0; render(); };
  renderTabs();
}

// शब्दांचा उच्चार आवाजात कसा वाचायचा ते येथे लिहा (मूळ मजकूर बदलत नाही)
const PRON = {
  "Raju": "Rah joo",
  "Maharashtra": "Mah-ha-RAHSH-truh",
  "Marathi": "Mah-RAH-thee",
  "Pune": "Poona",
  "Mumbai": "Mum bai"
};

function fillVoices() {
  const sel = $("voiceSel");
  if (!sel || sel.options.length > 1) return;
  speechSynthesis.getVoices().filter(v => v.lang.startsWith("en")).forEach(v => {
    const o = document.createElement("option");
    o.value = v.name;
    o.textContent = v.name + " (" + v.lang + ")";
    sel.appendChild(o);
  });
}

function pickEnglishVoice() {
  const voices = speechSynthesis.getVoices();
  const chosen = $("voiceSel") && $("voiceSel").value;
  if (chosen) { const c = voices.find(x => x.name === chosen); if (c) return c; }
  const india = voices.find(v => v.lang === "en-IN");
  if (india) return india;
  const natural = voices.find(v => v.lang.startsWith("en") && /Google US English|Natural|Aria|Jenny|Zira/i.test(v.name));
  if (natural) return natural;
  return voices.find(v => v.lang === "en-US")
      || voices.find(v => v.lang === "en-GB")
      || voices.find(v => v.lang.startsWith("en"))
      || null;
}

function speakText(text) {
  if (!("speechSynthesis" in window)) return;
  let spoken = text;
  for (const [word, sound] of Object.entries(PRON)) {
    spoken = spoken.replace(new RegExp("\\b" + word + "\\b", "g"), sound);
  }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(spoken);
  const voice = pickEnglishVoice();
  u.lang = voice ? voice.lang : "en-US";
  if (voice) u.voice = voice;
  u.rate = 0.8;
  u.pitch = 1.1;
  speechSynthesis.speak(u);
}

$("listen").onclick = () => speakText(LEVELS[state.level].items[state.idx][0]);

$("speak").onclick = () => {
  if (!SpeechRec) return;
  const target = LEVELS[state.level].items[state.idx][0];
  const rec = new SpeechRec();
  rec.lang = "en-US";
  rec.interimResults = false;
  rec.maxAlternatives = 3;
  $("speak").disabled = true;
  $("speak").textContent = "🎙 ऐकत आहे...";
  rec.onresult = e => {
    const heard = Array.from(e.results[0]).map(a => a.transcript);
    const best = heard.map(h => score(target, h)).reduce((a, b) => (b.ratio > a.ratio ? b : a));
    const key = `${state.level}-${state.idx}`;
    state.scores[key] = Math.max(state.scores[key] ?? 0, best.ratio);
    showResult(best, heard[0]);
  };
  rec.onerror = () => {
    $("result").innerHTML = '<p class="bad">बोलणे ओळखता आले नाही. परवानगी तपासा आणि पुन्हा प्रयत्न करा.</p>';
  };
  rec.onend = () => {
    $("speak").disabled = false;
    $("speak").textContent = "🎤 बोला";
  };
  rec.start();
};

function score(target, spoken) {
  const t = normalize(target).split(" ");
  const s = new Set(normalize(spoken).split(" "));
  const missing = t.filter(w => !s.has(w));
  const ratio = (t.length - missing.length) / t.length;
  return { ratio, missing };
}

function showResult(best, heardText) {
  const pct = Math.round(best.ratio * 100);
  const ok = best.ratio >= PASS;
  const missingHtml = best.missing.length
    ? `<div class="missing">राहिलेले शब्द: ${best.missing.map(w => `<span class="miss-word">${w}</span>`).join("")}</div>`
    : "";
  $("result").innerHTML = `
    <div class="result">
      <div class="${ok ? "good" : "bad"}">${ok ? "छान! " : "पुन्हा प्रयत्न करा. "}अचूकता: ${pct}%</div>
      <div class="heard">तुम्ही म्हणालात: “${heardText || "—"}”</div>
      ${missingHtml}
    </div>`;
  if (ok && state.idx < LEVELS[state.level].items.length - 1) {
    // leave user on same sentence so they can retry if they want
  }
}

$("next").onclick = () => { state.idx++; render(); };
$("prev").onclick = () => { if (state.idx > 0) { state.idx--; render(); } };

speechSynthesis.onvoiceschanged = fillVoices;
fillVoices();
render();
</script>
